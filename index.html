<!DOCTYPE html>
<html lang="ja">

<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>ARテスト</title>

<script type="module"
src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js">
</script>

</head>

<body>

<h2>3Dモデル ARテスト</h2>

<model-viewer
    src="https://modelviewer.dev/shared-assets/models/Astronaut.glb"
    ar
    ar-modes="webxr scene-viewer"
    camera-controls
    auto-rotate
    shadow-intensity="1"
    style="width:100%; height:600px;">

    <button slot="ar-button"
        style="
        position:absolute;
        bottom:20px;
        left:20px;
        padding:15px 25px;
        font-size:18px;">
        ARで表示
    </button>

</model-viewer>

</body>
</html>
